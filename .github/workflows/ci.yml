name: Verify both profiles

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }} · Codex + Claude
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - name: Configure reliable Ubuntu package downloads
        timeout-minutes: 1
        run: |
          # The runner's Azure mirror can stall before falling back to Ubuntu.
          # Include the mirror list used by mirror+file sources on Ubuntu 24.04.
          for source in /etc/apt/apt-mirrors.txt /etc/apt/sources.list \
            /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$source" ]; then
              sudo sed -i -E 's|https?://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done
          printf '%s\n' \
            'Acquire::Retries "3";' \
            'Acquire::http::Timeout "30";' \
            'Acquire::https::Timeout "30";' \
            | sudo tee /etc/apt/apt.conf.d/99vids-ci-network
      - name: Install locked JavaScript dependencies
        timeout-minutes: 3
        run: |
          bun install --frozen-lockfile
      - name: Install Chromium and browser system dependencies
        timeout-minutes: 8
        run: |
          bunx playwright install --with-deps chromium
      - name: Install media test tools
        # Hosted runners can need over five minutes for the ~63 MB dependency
        # set even while downloads continue; keep network timeouts bounded.
        timeout-minutes: 12
        run: |
          # Playwright's --with-deps has already refreshed the package index.
          sudo apt-get install -y --no-install-recommends ffmpeg
          python3 -m pip install Pillow==12.1.1
      - name: Check committed profile and run source tests
        run: |
          python3 scripts/build_profiles.py --profile codex --target . --check
          bun run test
          python3 -m unittest discover -s skill/google-vids/tests -p 'test_*.py'
          python3 -m unittest discover -s skill/vids-director/tests -p 'test_*.py'
      - name: Build a fresh Claude profile
        run: |
          python3 scripts/build_profiles.py --profile claude --target "$RUNNER_TEMP/vids-claude" --write
          python3 scripts/build_profiles.py --profile claude --target "$RUNNER_TEMP/vids-claude" --check
      - name: Test the fresh Claude profile, including cross-profile arbitration
        working-directory: ${{ runner.temp }}/vids-claude
        env:
          VIDS_STUDIO_CANONICAL_SOURCE: ${{ github.workspace }}
        run: |
          bun install --frozen-lockfile
          bun run test
          python3 -m unittest discover -s skill/vids-director/tests -p 'test_*.py'
      - name: Build deterministic release packages
        if: matrix.node == '24'
        run: |
          python3 scripts/build_release.py --output dist
          python3 scripts/build_release.py --output "$RUNNER_TEMP/vids-release-repeat"
          diff -r dist "$RUNNER_TEMP/vids-release-repeat"
          cd dist
          sha256sum --check SHA256SUMS
      - name: Keep verified packages
        if: matrix.node == '24'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vids-studio-preview
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  native-platform:
    name: ${{ matrix.os }} · native Codex + Claude
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - name: Install locked dependencies and native media tools
        run: |
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($IsWindows) {
            python -m pip install -r requirements-windows.txt
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            if ($IsWindows) { choco install ffmpeg --yes --no-progress }
            else { brew install ffmpeg }
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          ffmpeg -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ffprobe -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify native fleet endpoints, ownership and local media admission
        run: |
          python scripts/build_profiles.py --profile codex --target . --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p 'backend_platform.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/platform_smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s skill/google-vids/tests -p test_media_guard.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
